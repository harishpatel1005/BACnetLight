name=BACnetLight
version=2.0.0
author=Harish Patel
maintainer=Harish Patel <harishpatel1005@gmail.com>
sentence=Lightweight BACnet/IP & BACnet/MSTP library for ESP32 (device + client)
paragraph=A minimal, memory-efficient BACnet stack supporting BACnet/IP (UDP) and BACnet/MSTP (RS485), in both the device/server role and the client/master role. As a device: WhoIs/IAm, ReadProperty, ReadPropertyMultiple, WriteProperty with priority arrays, COV subscriptions, and 6 object types (AI, AO, AV, BI, BO, BV). As a client (BACnet/IP): broadcast Who-Is to discover devices and read/write their object properties. Designed for IoT gateways, HVAC controllers, BACnet-enabled sensors, and BACnet master/supervisory devices.
category=Communication
url=https://github.com/harishpatel1005/BACnetLight
architectures=esp32
depends=Ethernet
